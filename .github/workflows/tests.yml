name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Libraries PyQt6's wheels need to create widgets (headless, offscreen)
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m pyflakes lanscanman tests
          python -m isort --check-only --diff lanscanman tests main.py

      - name: Tests (no network access is attempted — see tests/conftest.py)
        run: python -m pytest -q
